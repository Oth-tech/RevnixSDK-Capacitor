<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <title>Example Capacitor App</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <main>
      <h1>Revnix Capacitor Test App</h1>
      <p>
        Exercises the plugin against a live Revnix deployment. Nothing in
        <em>example-app/</em> is published to npm.
      </p>
      <label for="apiKey">Publishable key:</label>
      <input type="text" id="apiKey" value="" placeholder="rvx_pk_test_…" autocapitalize="none" autocorrect="off" />
      <label for="baseUrl">Base URL:</label>
      <input type="text" id="baseUrl" value="" placeholder="https://your-deployment.convex.site" autocapitalize="none" autocorrect="off" />
      <button onclick="testConfigure()">Configure</button>
      <hr />
      <label for="entitlementId">Entitlement:</label>
      <input type="text" id="entitlementId" value="pro" />
      <button onclick="testEntitlement()">Check</button>
      <hr />
      <label for="placementKey">Placement:</label>
      <input type="text" id="placementKey" value="main_paywall" />
      <button onclick="testPlacement()">Resolve</button>
      <hr />
      <label for="productId">Product:</label>
      <input type="text" id="productId" value="com.voigu.app.m13" />
      <button onclick="testPurchase()">Buy</button>
      <button onclick="testRestore()">Restore</button>
      <pre id="output"></pre>
    </main>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
